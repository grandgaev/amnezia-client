name: macOS unsigned build

# Builds the macOS client without signing certificates (forks, local testing).
# The artifacts are not signed or notarized: after downloading, remove the
# quarantine attribute before opening them (see the job summary).

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'

env:
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/

jobs:
  Build-MacOS-Unsigned:
    runs-on: macos-15

    # One build per branch and job at a time: a new push waits for the
    # running job (a newer push replaces a job that is still waiting).
    concurrency:
      group: macos-unsigned-${{ github.ref }}-app
      cancel-in-progress: false

    env:
      QT_VERSION: 6.10.1
      # Installs as AmneziaVPNTest next to a regular AmneziaVPN: own bundle,
      # settings, keychain, service and sockets.
      AMNEZIA_INSTANCE_ID: Test
      APP_NAME: AmneziaVPNTest

    steps:
    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10

    - name: 'Setup xcode'
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3.0'

    - name: 'Install Qt'
      uses: jurplel/install-qt-action@v4.3.1
      with:
        version: ${{ env.QT_VERSION }}
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        modules: 'qtremoteobjects qt5compat qtshadertools'
        dir: ${{ runner.temp }}
        setup-python: 'true'
        set-env: 'true'
        aqtversion: '==3.3.0'
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Setup python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    # Conan packages built from source (patched AmneziaWG backends, ...) are
    # reused as long as the recipes do not change.
    - name: 'Restore conan packages'
      id: conan-cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.conan2/p
        key: conan-macos-${{ hashFiles('conanfile.py', 'recipes/**') }}
        restore-keys: conan-macos-

    - name: 'Setup ccache'
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: macos-unsigned
        max-size: 2G

    - name: 'Build project'
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
        CMAKE_C_COMPILER_LAUNCHER: ccache
        CMAKE_CXX_COMPILER_LAUNCHER: ccache
        CMAKE_OBJC_COMPILER_LAUNCHER: ccache
        CMAKE_OBJCXX_COMPILER_LAUNCHER: ccache
      shell: bash
      run: deploy/build.sh --generator Ninja --installer all

    # Saved even when a later step fails, so the next run does not rebuild
    # the dependencies.
    - name: 'Save conan packages'
      if: always() && steps.conan-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.conan2/p
        key: conan-macos-${{ hashFiles('conanfile.py', 'recipes/**') }}

    - name: 'Pack the app bundle'
      shell: bash
      run: |
        # The bundle staged by CPack went through macdeployqt (Qt frameworks,
        # QML plugins, the service); the one in the build tree did not.
        APP=$(find deploy/build/_CPack_Packages -name "$APP_NAME.app" -type d -prune | head -1)
        du -sh "$APP"
        echo "App bundle: $APP"
        test -n "$APP"
        ditto -c -k --keepParent "$APP" deploy/build/$APP_NAME-unsigned.app.zip
        ls -la deploy/build/*.pkg deploy/build/$APP_NAME-unsigned.app.zip
        echo "APP=$APP" >> "$GITHUB_ENV"

    - name: 'Upload installer (unsigned)'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.APP_NAME }}-macos-unsigned-pkg
        path: deploy/build/${{ env.APP_NAME }}_*.pkg
        retention-days: 14

    - name: 'Upload app bundle (unsigned)'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.APP_NAME }}-macos-unsigned-app
        path: deploy/build/${{ env.APP_NAME }}-unsigned.app.zip
        retention-days: 14

    # The runner is Apple Silicon: code with a missing or broken signature is
    # killed as soon as it is mapped, exactly as on a user's Mac.
    - name: 'Smoke test: the app starts'
      shell: bash
      run: |
        codesign --verify --deep --strict --verbose=2 "$APP" || echo "::warning::strict deep verification reported problems"
        "$APP/Contents/MacOS/$APP_NAME" > app.log 2>&1 &
        pid=$!
        sleep 20
        if kill -0 $pid 2>/dev/null; then
          echo "The app is running after 20 s"
          kill $pid || true
        else
          rc=0
          wait $pid || rc=$?
          tail -50 app.log
          echo "The app exited with status $rc"
          if [ $rc -gt 128 ]; then
            exit 1
          fi
        fi
        "$APP/Contents/MacOS/$APP_NAME-service" --help > service.log 2>&1 & spid=$!
        sleep 5
        if kill -0 $spid 2>/dev/null; then kill $spid || true; else
          rc=0
          wait $spid || rc=$?
          tail -20 service.log
          echo "The service exited with status $rc"
          if [ $rc -gt 128 ]; then
            exit 1
          fi
        fi

    - name: 'Installation notes'
      shell: bash
      run: |
        {
          echo "### Unsigned macOS build: $APP_NAME"
          echo "Installs next to a regular AmneziaVPN (own app, settings, keychain, service); do not connect both at once."
          echo "The VPN needs its privileged service, which the .pkg installs. Install with:"
          echo '```'
          echo "xattr -dr com.apple.quarantine ${APP_NAME}_*.pkg"
          echo "sudo installer -pkg ${APP_NAME}_*.pkg -target /"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

  # Compile checks of the Network Extension clients (iOS, macOS NE) without
  # signing: they only prove that the code builds, the result is not usable.
  Compile-Apple-NE-Unsigned:
    runs-on: ${{ matrix.runner }}

    concurrency:
      group: macos-unsigned-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        include:
          # ibtool needs the iOS platform of the selected Xcode to compile the
          # launch storyboards; the macos-26 image has it.
          - target: ios
            runner: macos-26
            xcode: '26.4'
          - target: macos-ne
            runner: macos-latest
            xcode: '26.0'

    env:
      QT_VERSION: 6.10.1

    steps:
    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10

    - name: 'Setup xcode'
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ matrix.xcode }}

    - name: 'Ensure the iOS platform'
      if: matrix.target == 'ios'
      shell: bash
      run: |
        SDK=$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)
        xcrun simctl list runtimes
        if ! xcrun simctl list runtimes | grep -q "iOS ${SDK}\."; then
          xcodebuild -downloadPlatform iOS
        fi

    - name: 'Install desktop Qt'
      uses: jurplel/install-qt-action@v4.3.1
      with:
        version: ${{ env.QT_VERSION }}
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        modules: 'qtremoteobjects qt5compat qtshadertools qtmultimedia'
        dir: ${{ runner.temp }}
        set-env: 'true'
        aqtversion: '==3.3.0'
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Install iOS Qt'
      if: matrix.target == 'ios'
      uses: jurplel/install-qt-action@v4.3.1
      with:
        version: ${{ env.QT_VERSION }}
        host: 'mac'
        target: 'ios'
        modules: 'qtremoteobjects qt5compat qtshadertools qtmultimedia'
        dir: ${{ runner.temp }}
        set-env: 'true'
        aqtversion: '==3.3.0'
        py7zrversion: '==0.22.*'
        extra: '--external 7z --base ${{ env.QT_MIRROR }}'

    - name: 'Setup python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install deps'
      run: pip install "conan==2.28.0" jsonschema jinja2

    - name: 'Restore conan packages'
      id: conan-cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.conan2/p
        key: conan-${{ matrix.target }}-${{ matrix.xcode }}-${{ hashFiles('conanfile.py', 'recipes/**') }}
        restore-keys: conan-${{ matrix.target }}-${{ matrix.xcode }}-

    - name: 'Configure'
      shell: bash
      run: |
        QT=${{ runner.temp }}/Qt/${QT_VERSION}
        if [ "${{ matrix.target }}" = ios ]; then
          cmake -S . -B build-ne -G Xcode -DCMAKE_BUILD_TYPE=Release -DDEPLOY=1 \
            -DCMAKE_TOOLCHAIN_FILE="$QT/ios/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$QT/macos" -DCMAKE_OSX_SYSROOT=iphoneos
        else
          cmake -S . -B build-ne -G Xcode -DCMAKE_BUILD_TYPE=Release -DDEPLOY=1 -DMACOS_NE=TRUE \
            -DCMAKE_PREFIX_PATH="$QT/macos"
        fi

    - name: 'Save conan packages'
      if: always() && steps.conan-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.conan2/p
        key: conan-${{ matrix.target }}-${{ matrix.xcode }}-${{ hashFiles('conanfile.py', 'recipes/**') }}

    - name: 'Build (no code signing)'
      shell: bash
      run: |
        cmake --build build-ne --config Release -- \
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE_SPECIFIER="" DEVELOPMENT_TEAM="" \
          2>&1 | grep -v -e '-DPROD_AGW_PUBLIC_KEY' -e '-DDEV_AGW_PUBLIC_KEY' | tail -300
        exit ${PIPESTATUS[0]}
