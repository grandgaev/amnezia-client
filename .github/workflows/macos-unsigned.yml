name: macOS unsigned build

# Builds the macOS client without signing certificates (forks, local testing).
# The artifacts are not signed or notarized: after downloading, remove the
# quarantine attribute before opening them (see the job summary).

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'

env:
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/

jobs:
  Build-MacOS-Unsigned:
    runs-on: macos-15

    env:
      QT_VERSION: 6.10.1

    steps:
    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10

    - name: 'Setup xcode'
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3.0'

    - name: 'Install Qt'
      uses: jurplel/install-qt-action@v4.3.1
      with:
        version: ${{ env.QT_VERSION }}
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        modules: 'qtremoteobjects qt5compat qtshadertools'
        dir: ${{ runner.temp }}
        setup-python: 'true'
        set-env: 'true'
        aqtversion: '==3.3.0'
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Setup python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    - name: 'Build project'
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
      shell: bash
      run: deploy/build.sh --generator Ninja --installer all

    - name: 'Pack the app bundle'
      shell: bash
      run: |
        APP=$(find deploy/build -maxdepth 3 -name "AmneziaVPN.app" -type d | head -1)
        echo "App bundle: $APP"
        test -n "$APP"
        ditto -c -k --keepParent "$APP" deploy/build/AmneziaVPN-unsigned.app.zip
        ls -la deploy/build/*.pkg deploy/build/AmneziaVPN-unsigned.app.zip

    - name: 'Upload installer (unsigned)'
      uses: actions/upload-artifact@v7
      with:
        name: AmneziaVPN-macos-unsigned-pkg
        path: deploy/build/AmneziaVPN_*.pkg
        retention-days: 14

    - name: 'Upload app bundle (unsigned)'
      uses: actions/upload-artifact@v7
      with:
        name: AmneziaVPN-macos-unsigned-app
        path: deploy/build/AmneziaVPN-unsigned.app.zip
        retention-days: 14

    - name: 'Installation notes'
      shell: bash
      run: |
        {
          echo "### Unsigned macOS build"
          echo "The VPN needs its privileged service, which the .pkg installs. Install with:"
          echo '```'
          echo 'xattr -dr com.apple.quarantine AmneziaVPN_*.pkg'
          echo 'sudo installer -pkg AmneziaVPN_*.pkg -target /'
          echo 'xattr -dr com.apple.quarantine /Applications/AmneziaVPN.app'
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
